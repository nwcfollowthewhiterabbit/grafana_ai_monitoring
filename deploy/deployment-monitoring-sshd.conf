# A dedicated account can only forward the listed private collector/ingress
# sockets. Its authorized key additionally disables sessions and all other use.
Match User monitoring-relay
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    AllowTcpForwarding yes
    GatewayPorts clientspecified
    PermitOpen 127.0.0.1:9090 127.0.0.1:3100 127.0.0.1:3000
    PermitListen 172.23.0.1:19110 172.23.0.1:19111 172.23.0.1:19100 172.23.0.1:19101 172.23.0.1:19116 172.23.0.1:19120 172.23.0.1:19182 172.23.0.1:19183
    MaxSessions 0
Match all
