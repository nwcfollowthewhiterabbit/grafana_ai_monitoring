name: monitoring

# Central production plane on deployment. Preserve the external bridge: the
# restricted SSH relay binds only its gateway, never a public interface.
services:
  incident-gateway:
    extends:
      file: con-monitoring-v2.override.yml
      service: incident-gateway
    image: ${INCIDENT_GATEWAY_IMAGE:?set reviewed revision-tagged gateway image}
    environment:
      GATEWAY_MODE: ${INCIDENT_GATEWAY_MODE:-shadow}
  alertmanager:
    extends:
      file: con-monitoring-v2.override.yml
      service: alertmanager
  prometheus:
    image: prom/prometheus:v3.4.0
    pull_policy: never
    container_name: monitoring-prometheus
    restart: unless-stopped
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=30d, --web.enable-remote-write-receiver]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - /etc/rabbit-monitoring/prometheus:/etc/prometheus:ro
      - /var/lib/monitoring/prometheus:/prometheus
  grafana:
    image: grafana/grafana-oss:12.0.0
    pull_policy: never
    container_name: monitoring-grafana
    restart: unless-stopped
    env_file:
      - path: /etc/rabbit-monitoring/grafana.env
        format: raw
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - /var/lib/monitoring/grafana:/var/lib/grafana
      - /etc/rabbit-monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus, loki, prom-label-proxy-greenleaf]
  loki:
    image: grafana/loki:2.9.8
    pull_policy: never
    container_name: monitoring-loki
    restart: unless-stopped
    command: [-config.file=/etc/loki/local-config.yaml]
    ports: ["127.0.0.1:3100:3100"]
    volumes:
      - /etc/rabbit-monitoring/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - /var/lib/monitoring/loki:/loki
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    pull_policy: never
    container_name: monitoring-blackbox
    restart: unless-stopped
    command: [--config.file=/etc/blackbox_exporter/config.yml]
    ports: ["127.0.0.1:9115:9115"]
    volumes:
      - /etc/rabbit-monitoring/blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
  prom-label-proxy-greenleaf:
    image: quay.io/prometheuscommunity/prom-label-proxy:v0.13.0
    pull_policy: never
    container_name: monitoring-prom-label-proxy-greenleaf
    restart: unless-stopped
    command: [-label=company, -label-value=greenleaf, -upstream=http://prometheus:9090, -insecure-listen-address=0.0.0.0:8080, -enable-label-apis, -error-on-replace]
    networks: [default, backup_observations]
  node-exporter-deployment:
    image: prom/node-exporter:v1.9.1
    pull_policy: never
    container_name: monitoring-node-exporter-deployment
    restart: unless-stopped
    command: [--path.rootfs=/host, --collector.textfile.directory=/textfile]
    pid: host
    volumes:
      - /:/host:ro,rslave
      - /var/lib/node-exporter-textfile:/textfile:ro
  cadvisor-deployment:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    pull_policy: never
    container_name: monitoring-cadvisor-deployment
    restart: unless-stopped
    privileged: true
    devices: [/dev/kmsg]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

networks:
  backup_observations:
    external: true
    name: rabbit_backup_observations
  default:
    external: true
    name: monitoring_default
