# Per-host accounts; no sessions, arbitrary destinations or public listeners.
Match User monitoring-con2
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    AllowTcpForwarding remote
    GatewayPorts clientspecified
    PermitOpen none
    PermitListen 172.23.0.1:19130
    MaxSessions 0
Match User monitoring-voice
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    AllowTcpForwarding remote
    GatewayPorts clientspecified
    PermitOpen none
    PermitListen 172.23.0.1:19131
    MaxSessions 0
Match all
