auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Deletion is deliberately disabled in the repository baseline. Choosing and
# applying a retention period to an existing Loki store is a separate reviewed
# migration; a routine Compose restart must never begin deleting old data.
compactor:
  working_directory: /loki/compactor
  retention_enabled: false

ruler:
  alertmanager_url: http://alertmanager:9093
