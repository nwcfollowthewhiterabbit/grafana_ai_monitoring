services:
  grafana:
    image: grafana/grafana-oss:12.0.0
    container_name: monitoring-grafana
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: grafana.exemstsc.world
      GF_SERVER_ROOT_URL: https://grafana.exemstsc.world/
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /var/lib/monitoring/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki

  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: monitoring-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/file_sd:/etc/prometheus/file_sd:ro
      - /var/lib/monitoring/prometheus:/prometheus
    depends_on:
      - blackbox
      - node-exporter-con
      - cadvisor-con
      - snmp-exporter

  prom-label-proxy-greenleaf:
    image: quay.io/prometheuscommunity/prom-label-proxy:v0.13.0
    container_name: monitoring-prom-label-proxy-greenleaf
    restart: unless-stopped
    command:
      - -label=company
      - -label-value=greenleaf
      - -upstream=http://prometheus:9090
      - -insecure-listen-address=0.0.0.0:8080
      - -enable-label-apis
      - -error-on-replace
    depends_on:
      - prometheus

  node-exporter-con:
    image: prom/node-exporter:v1.9.1
    container_name: monitoring-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.filesystem.fs-types-exclude=^(sysfs|procfs|devtmpfs|tmpfs|overlay|cgroup2?)$
    pid: host
    volumes:
      - /:/host:ro,rslave
      - /var/lib/node-exporter-textfile:/textfile:ro

  cadvisor-con:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: monitoring-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    container_name: monitoring-blackbox
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    ports:
      - "127.0.0.1:9115:9115"
    volumes:
      - ./blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro

  snmp-exporter:
    image: quay.io/prometheus/snmp-exporter:v0.29.0
    container_name: monitoring-snmp-exporter
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/snmp_exporter/snmp.yml
      - --web.listen-address=172.17.0.1:9116

  loki:
    image: grafana/loki:2.9.8
    container_name: monitoring-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - /var/lib/monitoring/loki:/loki
