                refId: B
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 30m
          annotations:
            description: A configured Windows backup path cannot be listed for more than 30 minutes.
            summary: Windows backup path is unavailable
          labels:
            category: backup
            managed_by: codex
            notify: immediate
            severity: critical
          isPaused: false
        - uid: windows-backup-stale
          title: Windows backup did not refresh
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 600
