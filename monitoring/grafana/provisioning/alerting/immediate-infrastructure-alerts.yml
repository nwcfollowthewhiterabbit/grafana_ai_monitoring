              datasourceUid: PBFA97CFB590B2093
              model:
                datasource:
                    type: prometheus
                    uid: PBFA97CFB590B2093
                editorMode: code
                expr: ((time() - windows_custom_backup_path_latest_timestamp_seconds{job="windows_exporter_clients"}) > 90000) or (windows_custom_backup_path_latest_timestamp_seconds{job="windows_exporter_clients"} == 0)
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
