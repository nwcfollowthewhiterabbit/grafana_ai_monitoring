                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            description: An SNMP-discovered MikroTik interface is not operationally up. Filter expected-down ports after discovery if needed.
            summary: MikroTik interface is not up
          labels:
            category: mikrotik
            managed_by: codex
            notify: immediate
            severity: warning
          isPaused: false
