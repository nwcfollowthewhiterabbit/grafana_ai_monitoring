apiVersion: 1

providers:
  - name: Node monitoring
    orgId: 1
    folder: Nodes
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
  - name: Greenleaf customer monitoring
    orgId: 2
    folder: Greenleaf
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/company-dashboards/greenleaf
