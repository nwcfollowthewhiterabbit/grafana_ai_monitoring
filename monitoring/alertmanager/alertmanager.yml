global:
  resolve_timeout: 5m

route:
  receiver: incident-gateway
  group_by:
    - alertname
    - company
    - alias
    - stack
    - service
  group_wait: 30s
  group_interval: 2m
  repeat_interval: 4h
  routes:
    - receiver: incident-gateway
      matchers:
        - severity="critical"
      group_wait: 15s
      repeat_interval: 1h
    - receiver: incident-gateway
      matchers:
        - severity="warning"
      repeat_interval: 4h

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - company
      - alias
      - stack
      - service
  - source_matchers:
      - alertname="NodeDown"
    target_matchers:
      - alertname=~"CadvisorDown|StackMetricsStale|ServiceContainerStopped|ExpectedComponentMissing"
    equal:
      - company
      - alias
  - source_matchers:
      - alertname="StackMetricsStale"
    target_matchers:
      - alertname=~"ServiceContainerStopped|ExpectedComponentMissing"
    equal:
      - company
      - alias
  - source_matchers:
      - alertname="RootDiskCritical"
    target_matchers:
      - alertname="RootDiskLow"
    equal:
      - company
      - alias
  - source_matchers:
      - alertname="TLSCertificateExpiryCritical"
    target_matchers:
      - alertname="TLSCertificateExpiring"
    equal:
      - instance
  - source_matchers:
      - alertname="ServiceEventDueCritical"
    target_matchers:
      - alertname="ServiceEventDueSoon"
    equal:
      - company
      - event_id

receivers:
  - name: incident-gateway
    webhook_configs:
      - url: http://incident-gateway:8080/api/v1/alerts
        send_resolved: true
        max_alerts: 0
