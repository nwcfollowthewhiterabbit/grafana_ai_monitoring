version: 2

labels:
  required:
    - company
    - alias
    - stack
    - service
    - criticality
  company_values:
    - greenleaf
    - rentall
    - my own

# Canonical source of truth. The legacy sections below remain available during
# migration and are checked against this hierarchy by the catalog validator.
owners:
