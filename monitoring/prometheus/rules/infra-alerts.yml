groups:
  - name: infrastructure
    interval: 30s
    rules:
      - alert: NodeDown
        expr: up{job="node_exporter_clients",monitoring_status!="pending_access"} == 0
        for: 2m
        keep_firing_for: 2m
        labels:
          stack: host
          service: node-exporter
          category: infrastructure
          notification_route: admin
          severity: critical
        annotations:
          summary: "Node exporter is unreachable on {{ $labels.alias }}"
          description: "Prometheus cannot scrape node_exporter on {{ $labels.alias }} / {{ $labels.company }}. This establishes loss of host telemetry, not proof that the host itself is powered off."
          runbook_url: "https://github.com/nwcfollowthewhiterabbit/grafana_ai_monitoring/blob/main/docs/managed-monitoring-v2-runbook.md#node-or-exporter-down"

      - alert: CadvisorDown
        expr: up{job="cadvisor_clients"} == 0
        for: 2m
        keep_firing_for: 2m
        labels:
          stack: host
          service: cadvisor
          category: infrastructure
          notification_route: admin
          severity: warning
        annotations:
          summary: "cAdvisor is down on {{ $labels.alias }}"
          description: "Container runtime metrics are missing for {{ $labels.alias }} / {{ $labels.company }}."
          runbook_url: "https://github.com/nwcfollowthewhiterabbit/grafana_ai_monitoring/blob/main/docs/managed-monitoring-v2-runbook.md#node-or-exporter-down"

      - alert: RootDiskLow
        expr: (node_filesystem_avail_bytes{job="node_exporter_clients",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job="node_exporter_clients",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}) * 100 < 15
        for: 10m
        keep_firing_for: 5m
        labels:
          stack: host
          service: root-filesystem
          category: capacity
          notification_route: admin
          severity: warning
        annotations:
          summary: "Low root disk space on {{ $labels.alias }}"
          description: "Root filesystem free space is below 15% on {{ $labels.alias }}."
          runbook_url: "https://github.com/nwcfollowthewhiterabbit/grafana_ai_monitoring/blob/main/docs/managed-monitoring-v2-runbook.md#disk-capacity"

      - alert: RootDiskCritical
        expr: (node_filesystem_avail_bytes{job="node_exporter_clients",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job="node_exporter_clients",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}) * 100 < 5
        for: 5m
        keep_firing_for: 5m
        labels:
          stack: host
          service: root-filesystem
          category: capacity
          notification_route: admin
          severity: critical
        annotations:
          summary: "Critically low root disk space on {{ $labels.alias }}"
          description: "Root filesystem free space is below 5% on {{ $labels.alias }}."
          runbook_url: "https://github.com/nwcfollowthewhiterabbit/grafana_ai_monitoring/blob/main/docs/managed-monitoring-v2-runbook.md#disk-capacity"

      - alert: HostMemoryHigh
        expr: (1 - (node_memory_MemAvailable_bytes{job="node_exporter_clients"} / node_memory_MemTotal_bytes{job="node_exporter_clients"})) * 100 > 90
        for: 10m
        keep_firing_for: 5m
        labels:
          stack: host
          service: memory
          category: capacity
          notification_route: admin
          severity: warning
        annotations:
          summary: "High host memory usage on {{ $labels.alias }}"
          description: "Host memory usage is above 90% on {{ $labels.alias }}."

      - alert: ServiceContainerStopped
        expr: |
          max by (company, alias, stack, service) (
            docker_stack_container_running
          ) == 0
          and on (company, alias, stack, service)
          rs_monitoring_expected_component_info
          and on (company, alias)
          rs_monitoring_docker_telemetry_fresh
        for: 5m
        keep_firing_for: 2m
        labels:
          category: application
          notification_route: admin
          severity: warning
        annotations:
          summary: "Expected component stopped: {{ $labels.alias }}/{{ $labels.stack }}/{{ $labels.service }}"
          description: "Fresh Docker inventory reports every observed container for this catalog-managed component stopped. One-shot and discovery-pending components are excluded. This is runtime state, not an application healthcheck."

      - alert: ExpectedComponentMissing
        expr: |
          (
            rs_monitoring_expected_component_info
            unless on (company, alias, stack, service)
            docker_stack_container_running
          )
          and on (company, alias)
          rs_monitoring_docker_telemetry_fresh
        for: 15m
        keep_firing_for: 2m
        labels:
          category: application
          notification_route: admin
          severity: warning
        annotations:
          summary: "Expected component missing: {{ $labels.alias }}/{{ $labels.stack }}/{{ $labels.service }}"
          description: "The service catalog expects this component to run, but fresh Docker inventory reports no matching container. Missing or stale telemetry is tracked separately as unknown coverage."

      - alert: StackMetricsStale
        expr: |
          (
            up{job="node_exporter_clients",monitoring_status!="pending_access"} == 1
            and on (company, alias)
            rs_monitoring_expected_component_info
          )
          unless on (company, alias)
          rs_monitoring_docker_telemetry_fresh
        for: 5m
        keep_firing_for: 2m
        labels:
          stack: monitoring
          service: docker-inventory
          category: monitoring
          notification_route: admin
          severity: warning
        annotations:
          summary: "Docker stack metrics are stale on {{ $labels.alias }}"
          description: "The catalog expects Docker components, but their textfile is missing, older than 15 minutes, future-dated by more than 60 seconds, or the textfile collector reports a parse error. Application runtime state is UNKNOWN until valid telemetry returns."
