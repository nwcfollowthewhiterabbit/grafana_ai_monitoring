global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
        labels:
          company: my own
          alias: con
          stack: monitoring
          service: alertmanager

  - job_name: incident_gateway
    metrics_path: /metrics
    honor_labels: true
    static_configs:
      - targets:
          - incident-gateway:8080
        labels:
          company: my own
          alias: con
          stack: monitoring
          service: incident-gateway

  - job_name: node_exporter_clients
    static_configs:
      - targets:
          - node-exporter-con:9100
        labels:
          alias: con
          company: my own
      - targets:
          - 139.99.155.118:9100
        labels:
          alias: cloud
          company: greenleaf
      - targets:
          - 139.99.155.122:9100
        labels:
          alias: testing
          company: greenleaf
      - targets:
          - 139.99.171.55:9100
        labels:
          alias: new
          company: greenleaf
          monitoring_status: pending_access
      - targets:
          - 172.17.0.1:19100
        labels:
          alias: test
          company: my own
      - targets:
          - 64.227.115.196:9100
        labels:
          alias: payroll
          company: rentall
      - targets:
          - 141.94.121.160:9100
        labels:
          alias: howbot
          company: rentall

  - job_name: cadvisor_clients
    static_configs:
      - targets:
          - cadvisor-con:8080
        labels:
          alias: con
          company: my own
      - targets:
          - 139.99.155.118:18082
        labels:
          alias: cloud
          company: greenleaf
      - targets:
          - 139.99.155.122:18082
        labels:
          alias: testing
          company: greenleaf
      - targets:
          - 172.17.0.1:19101
        labels:
          alias: test
          company: my own
      - targets:
          - 64.227.115.196:18082
        labels:
          alias: payroll
          company: rentall
      - targets:
          - 141.94.121.160:18082
        labels:
          alias: howbot
          company: rentall

  - job_name: windows_exporter_clients
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/windows_targets.yml

  - job_name: mikrotik_snmp
    metrics_path: /snmp
    params:
      auth:
        - public_v2
      module:
        - if_mib
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/mikrotik_targets.yml
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: 172.17.0.1:9116

  - job_name: blackbox
    static_configs:
      - targets:
          - blackbox:9115

  - job_name: blackbox_http_services
    metrics_path: /probe
    params:
      module:
        - http_2xx
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/http_targets.yml
        refresh_interval: 5m
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
